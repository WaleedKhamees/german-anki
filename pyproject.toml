[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "danki"
version = "1.0.0"
description = "German vocabulary mining: mpv word capture, Anki card creation, subtitle colouring"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "pyperclip>=1.8",
    "playwright>=1.40",
    "Pillow>=10",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
danki = "danki.cli:main"

[tool.setuptools]
packages = ["danki"]
